name: Deploy AUR3M in-house
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aur3m-inhouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_API_BASE_URL: https://aur3m-api-prod-hyd2dccqf2gugjf5.ukwest-01.azurewebsites.net
      - name: Verify complete static export
        run: test -f out/index.html && test -f out/404.html && test -f out/dosar-aur3m.html && test -f out/sitemap.xml
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: aur3m-static-export
          path: web/dist/
          retention-days: 7
  publish_vm:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - uses: actions/download-artifact@v4
        with:
          name: aur3m-static-export
          path: web/dist
      - run: bash tools/publish-vm.sh
